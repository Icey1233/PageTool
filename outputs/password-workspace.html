<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录工作台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --panel: #ffffff;
      --panel-2: #eef3f0;
      --ink: #17211c;
      --muted: #63706a;
      --line: #d9e0da;
      --brand: #246b58;
      --brand-2: #ba4d36;
      --warn: #9b5b14;
      --danger: #b3261e;
      --shadow: 0 12px 36px rgba(23, 33, 28, .10);
      --radius: 8px;
      --cursor: url("assets/cursor.png") 4 4, auto;
      --cursor-pointer: url("assets/cursor.png") 4 4, pointer;
      --spotlight-x: 50vw;
      --spotlight-y: 50vh;
      --parallax-x: 0px;
      --parallax-y: 0px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: var(--cursor);
    }

    * {
      box-sizing: border-box;
      cursor: var(--cursor);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      background-image: linear-gradient(rgba(246, 247, 244, .38), rgba(246, 247, 244, .38)), url("assets/background.png");
      background-size: cover;
      background-position: calc(50% + var(--parallax-x)) calc(50% + var(--parallax-y));
      background-attachment: fixed;
      color: var(--ink);
      letter-spacing: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: rgba(246, 247, 244, .08);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        radial-gradient(circle 170px at var(--spotlight-x) var(--spotlight-y), rgba(255, 255, 255, .42), rgba(255, 255, 255, 0) 62%),
        radial-gradient(circle 320px at var(--spotlight-x) var(--spotlight-y), rgba(36, 107, 88, .16), rgba(36, 107, 88, 0) 70%);
      mix-blend-mode: screen;
      opacity: .82;
    }

    button, input, textarea, select {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
      cursor: var(--cursor-pointer);
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }

    button:hover {
      border-color: #aab8b0;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(23, 33, 28, .08);
    }
    button:disabled { opacity: .55; cursor: var(--cursor); }

    button *, .site-row *, .rank-row *, .workspace-btn *, .check-row * {
      cursor: inherit;
    }

    .primary {
      background: var(--brand);
      color: white;
      border-color: var(--brand);
    }

    .danger {
      color: var(--danger);
      border-color: #efc8c4;
      background: #fff8f7;
    }

    .ghost {
      background: transparent;
    }

    .icon-btn {
      width: 36px;
      padding: 0;
      flex: 0 0 36px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
    }

    aside {
      border-right: 1px solid var(--line);
      background: rgba(251, 252, 250, .54);
      backdrop-filter: blur(12px);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    main {
      min-width: 0;
      padding: 20px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 20px;
      line-height: 1.2;
      margin: 0;
    }

    h2 {
      font-size: 17px;
      margin: 0;
      line-height: 1.25;
    }

    h3 {
      font-size: 14px;
      margin: 0;
      line-height: 1.25;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    input, textarea, select {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, .48);
      color: var(--ink);
      min-height: 38px;
      padding: 8px 10px;
      outline: none;
    }

    input, textarea, select,
    input:hover, textarea:hover, select:hover,
    input:focus, textarea:focus, select:focus {
      cursor: var(--cursor);
    }

    textarea {
      resize: vertical;
      min-height: 78px;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(36, 107, 88, .12);
    }

    .lock-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .lock-panel {
      width: min(460px, 100%);
      background: rgba(255, 255, 255, .58);
      backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      display: grid;
      gap: 18px;
    }

    .lock-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .notice {
      border: 1px solid #e7d3ad;
      background: #fff9ec;
      color: #65420c;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.45;
    }

    .error {
      border-color: #efc8c4;
      background: #fff8f7;
      color: var(--danger);
    }

    .side-section {
      display: grid;
      gap: 8px;
    }

    .sync-section {
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .sync-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .sync-countdown {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(247, 248, 245, .48);
      padding: 8px;
    }

    .workspace-list {
      display: grid;
      gap: 6px;
      overflow: auto;
      min-height: 0;
    }

    .workspace-btn {
      justify-content: flex-start;
      width: 100%;
      min-height: 40px;
    }

    .workspace-btn.active {
      border-color: var(--brand);
      background: rgba(233, 244, 239, .54);
      color: #124836;
    }

    .workspace-btn.drop-target {
      border-color: var(--brand-2);
      background: rgba(255, 241, 237, .58);
      color: #6f2d1e;
      box-shadow: 0 0 0 3px rgba(186, 77, 54, .12);
      animation: dropPulse 1s ease-in-out infinite;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .search-wrap {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      min-width: 0;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      min-height: 32px;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(238, 243, 240, .48);
      color: #405047;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      align-items: start;
    }

    .panel {
      position: relative;
      background: rgba(255, 255, 255, .52);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 16px 46px rgba(23, 33, 28, .12), inset 0 1px 0 rgba(255, 255, 255, .58);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255, 255, 255, .42), rgba(255, 255, 255, 0) 34%);
      opacity: .8;
    }

    .panel:hover {
      transform: translateY(-1px);
      border-color: rgba(36, 107, 88, .26);
      box-shadow: 0 18px 54px rgba(23, 33, 28, .16), inset 0 1px 0 rgba(255, 255, 255, .7);
    }

    .panel-head {
      min-height: 52px;
      border-bottom: 1px solid var(--line);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .table {
      display: grid;
    }

    .site-row {
      display: grid;
      grid-template-columns: minmax(150px, 1.1fr) minmax(120px, .9fr) minmax(100px, .8fr) 178px;
      gap: 10px;
      align-items: center;
      min-height: 62px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .site-row:last-child { border-bottom: 0; }

    .site-row:hover {
      background: rgba(250, 251, 249, .38);
      transform: translateX(3px);
      box-shadow: inset 3px 0 0 rgba(36, 107, 88, .42);
    }

    .site-row[draggable="true"] {
      cursor: var(--cursor-pointer);
    }

    .site-row.is-dragging {
      opacity: .58;
      cursor: var(--cursor-pointer);
    }

    .site-card.is-dragging {
      opacity: .58;
      transform: scale(.98);
    }

    .table.is-switching {
      animation: listIn .26s ease both;
    }

    .site-main, .site-meta {
      min-width: 0;
    }

    .site-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .site-copy {
      min-width: 0;
    }

    .site-icon {
      position: relative;
      width: 28px;
      height: 28px;
      border: 1px solid #d9e1db;
      border-radius: 7px;
      background: rgba(241, 245, 242, .46);
      display: grid;
      place-items: center;
      color: #4a584f;
      font-size: 12px;
      font-weight: 800;
      flex: 0 0 28px;
      overflow: hidden;
    }

    .site-favicon {
      position: absolute;
      inset: 4px;
      width: 18px;
      height: 18px;
      object-fit: contain;
      z-index: 1;
    }

    .site-favicon.hidden {
      display: none;
    }

    .site-letter {
      line-height: 1;
    }

    .site-title {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .site-title-line {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .favorite-mark {
      color: #c78416;
      font-size: 13px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .site-url, .muted {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tagline {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 5px;
    }

    .tag {
      font-size: 11px;
      color: #4a584f;
      background: rgba(237, 242, 239, .50);
      border-radius: 999px;
      padding: 3px 7px;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .site-group {
      border-bottom: 1px solid var(--line);
    }

    .site-group:last-child {
      border-bottom: 0;
    }

    .site-group-head {
      min-height: 42px;
      padding: 9px 12px;
      background: rgba(247, 248, 245, .46);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .site-group-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .site-card-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      padding: 12px;
    }

    .site-card {
      min-width: 0;
      min-height: 84px;
      border: 1px solid rgba(217, 224, 218, .8);
      border-radius: 8px;
      background: rgba(255, 255, 255, .38);
      display: grid;
      gap: 8px;
      align-content: start;
      padding: 10px;
      cursor: var(--cursor-pointer);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .site-card:hover {
      background: rgba(250, 251, 249, .50);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(23, 33, 28, .12);
    }

    .site-card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .site-card *, .panel-actions * {
      cursor: inherit;
    }

    .row-actions {
      display: grid;
      grid-template-columns: 72px repeat(3, 36px);
      gap: 5px;
      justify-content: end;
    }

    .favorite-btn.is-favorite {
      color: #c78416;
      border-color: #e5c178;
      background: rgba(255, 247, 223, .58);
      animation: starPop .34s ease;
    }

    .login-btn {
      background: rgba(233, 244, 239, .58);
      border-color: #b9d6ca;
      color: #124836;
      font-weight: 700;
    }

    .password-tools {
      display: grid;
      grid-template-columns: 1fr 36px 36px;
      gap: 6px;
    }

    .url-tools {
      display: grid;
      grid-template-columns: 1fr 36px;
      gap: 6px;
    }

    .form {
      padding: 12px;
      display: grid;
      gap: 12px;
    }

    .rank-list {
      display: grid;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 44px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      cursor: var(--cursor-pointer);
    }

    .rank-row:last-child {
      border-bottom: 0;
    }

    .rank-row:hover {
      background: rgba(250, 251, 249, .38);
    }

    .rank-index {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .workspace-editor {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      display: grid;
      gap: 10px;
    }

    .form-block {
      display: grid;
      gap: 7px;
    }

    .form-block-title {
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    .checkbox-list {
      max-height: 210px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, .42);
    }

    .check-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font-size: 13px;
    }

    .check-row:last-child { border-bottom: 0; }
    .check-row input { min-height: 0; width: 16px; height: 16px; }

    .empty {
      min-height: 220px;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(420px, calc(100vw - 36px));
      background: #17211c;
      color: white;
      border-radius: 7px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: .18s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden { display: none !important; }

    @keyframes listIn {
      from {
        opacity: .65;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes starPop {
      0% { transform: scale(.86) rotate(-8deg); }
      55% { transform: scale(1.12) rotate(8deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes dropPulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(186, 77, 54, .12); }
      50% { box-shadow: 0 0 0 6px rgba(186, 77, 54, .20); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 16px;
    }

    @media (max-width: 1040px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .workspace-list {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .site-card-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      main, aside {
        padding: 12px;
      }

      .topbar, .search-wrap, .field-grid, .form-actions, .lock-actions {
        grid-template-columns: 1fr;
      }

      .site-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .row-actions {
        justify-content: start;
        grid-template-columns: 72px repeat(3, 36px);
      }

      .panel-head, .panel-actions {
        align-items: stretch;
      }

      .panel-head {
        flex-direction: column;
      }

      .site-card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stats {
        justify-content: flex-start;
      }
    }

    @media (max-width: 460px) {
      .site-card-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section id="lockScreen" class="lock-screen">
    <div class="lock-panel">
      <div>
        <h1>登录工作台</h1>
        <p>本地保存网站、账号、密码和任务工作区。</p>
      </div>
      <div id="firstRunNote" class="notice hidden">首次使用：输入一个主密码并初始化。此密码不会保存，忘记后无法解密已有数据。</div>
      <div id="lockError" class="notice error hidden"></div>
      <label>
        主密码
        <input id="masterPassword" type="password" autocomplete="current-password" placeholder="输入主密码">
      </label>
      <div class="lock-actions">
        <button id="unlockBtn" class="primary" type="button">解锁</button>
        <button id="resetBtn" class="danger" type="button">清空重置</button>
      </div>
    </div>
  </section>

  <section id="app" class="app hidden">
    <aside>
      <div class="brand-row">
        <div>
          <h1>登录工作台</h1>
          <p id="vaultState">已解锁</p>
        </div>
        <button id="lockBtn" class="icon-btn" title="锁定" type="button">
          <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        </button>
      </div>

      <div class="side-section">
        <button id="allSitesBtn" class="workspace-btn active" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
          全部网站
        </button>
        <div class="workspace-list" id="workspaceList"></div>
      </div>

      <div class="side-section">
        <button id="clearClipboardBtn" type="button">
          <svg viewBox="0 0 24 24"><rect x="8" y="4" width="8" height="4" rx="1"></rect><path d="M8 6H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2"></path><path d="m9 14 6 6"></path><path d="m15 14-6 6"></path></svg>
          清空剪贴板
        </button>
        <label>
          自动锁定
          <select id="autoLockSelect">
            <option value="0">不自动锁定</option>
            <option value="5">5 分钟</option>
            <option value="15" selected>15 分钟</option>
            <option value="30">30 分钟</option>
          </select>
        </label>
      </div>

      <div class="side-section sync-section">
        <div>
          <h3>Gist 同步</h3>
          <p class="muted">只填 Token，Gist 会自动查找或创建</p>
        </div>
        <label>
          GitHub Token
          <input id="gistTokenInput" type="password" autocomplete="off" placeholder="需要 Gists 读写权限">
        </label>
        <div class="sync-actions">

                <input id="workspaceName" placeholder="例如：上线发布">

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = 'login-workbench:vault';
    const SYNC_SETTINGS_KEY = 'login-workbench:gist-sync';
    const GIST_FILENAME = 'password-workspace-vault.json';
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    const state = {
      unlocked: false,
      key: null,
      salt: null,
      vault: { sites: [], workspaces: [] },
      selectedWorkspaceId: null,
      editingWorkspaceId: null,
      draggingSiteId: null,
      draggingSourceWorkspaceId: null,
      autoLockMinutes: 15,
      autoLockTimer: null,
      autoSyncTimer: null,
      autoSyncDueAt: 0,
      autoSyncInterval: null,
      autoSyncInFlight: false,
      sync: { token: '', gistId: '', lastSyncAt: '' }
    };

    const $ = (id) => document.getElementById(id);

    const icons = {
      open: '<svg viewBox="0 0 24 24"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>',
      user: '<svg viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"></path><circle cx="12" cy="7" r="4"></circle></svg>',
      key: '<svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="3.5"></circle><path d="m10 13 9-9"></path><path d="m15 4 5 5"></path></svg>',
      edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>',
      star: '<svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2L5.8 21 7 14.2 2 9.3l6.9-1Z"></path></svg>'
    };

    const sortByRecent = (a, b) => {
      const timeB = Date.parse(b.lastUsedAt || b.updatedAt || b.createdAt || 0);
      const timeA = Date.parse(a.lastUsedAt || a.updatedAt || a.createdAt || 0);
      return timeB - timeA;
    };

    function uid(prefix) {
      return `${prefix}_${crypto.randomUUID()}`;
    }

    function getSiteHost(url) {
      try {
        return new URL(normalizeUrl(url)).hostname;
      } catch (error) {
        return '';
      }
    }

    function getFaviconUrl(url) {
      const host = getSiteHost(url);
      return host ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=32` : '';
    }

    function getSiteLetter(site) {
      return String(site.name || getSiteHost(site.url) || '?').trim().slice(0, 1).toUpperCase() || '?';
    }

    function bytesToBase64(bytes) {
      return btoa(String.fromCharCode(...new Uint8Array(bytes)));
    }

    function base64ToBytes(value) {
      return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
    }

    async function deriveKey(password, salt) {
      const material = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptVault() {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const payload = encoder.encode(JSON.stringify(state.vault));
      const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, state.key, payload);
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 1,
        salt: bytesToBase64(state.salt),
        iv: bytesToBase64(iv),
        data: bytesToBase64(cipher),
        savedAt: new Date().toISOString()
      }));
    }

    async function decryptVault(password, stored) {
      const salt = base64ToBytes(stored.salt);
      const key = await deriveKey(password, salt);
      const plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: base64ToBytes(stored.iv) },
        key,
        base64ToBytes(stored.data)
      );
      return { key, salt, vault: JSON.parse(decoder.decode(plain)) };
    }

    async function unlock() {
      const password = $('masterPassword').value;
      const storedRaw = localStorage.getItem(STORAGE_KEY);
      $('lockError').classList.add('hidden');
      if (!password || password.length < 6) {
        showLockError('主密码至少 6 位。');
        return;
      }

      try {
        if (!storedRaw) {
          state.salt = crypto.getRandomValues(new Uint8Array(16));
          state.key = await deriveKey(password, state.salt);
          state.vault = seedVault();
          await encryptVault();
        } else {
          const result = await decryptVault(password, JSON.parse(storedRaw));
          state.key = result.key;
          state.salt = result.salt;
          state.vault = normalizeVault(result.vault);
        }
        state.unlocked = true;
        $('masterPassword').value = '';
        $('lockScreen').classList.add('hidden');
        $('app').classList.remove('hidden');
        $('autoLockSelect').value = String(state.autoLockMinutes);
        scheduleAutoLock();
        loadSyncSettings();
        render();
        toast('已解锁');
      } catch (error) {
        showLockError('无法解锁，请检查主密码。');
      }
    }

    function showLockError(message) {
      $('lockError').textContent = message;
      $('lockError').classList.remove('hidden');
    }

    function normalizeVault(vault) {
      return {
        sites: Array.isArray(vault.sites) ? vault.sites.map((site) => ({
          tags: [],
          note: '',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          lastUsedAt: '',
          openCount: 0,
          favorite: false,
          ...site
        })) : [],
        workspaces: Array.isArray(vault.workspaces) ? vault.workspaces.map((workspace) => ({
          siteIds: [],
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          ...workspace
        })) : [],
        sync: {
          token: '',
          gistId: '',
          lastSyncAt: '',
          ...(vault && vault.sync ? vault.sync : {})
        }
      };
    }

    function seedVault() {
      const now = new Date().toISOString();
      return {
        sites: [
          {
            id: uid('site'),
            name: '示例网站',
            url: 'https://example.com',
            username: 'demo@example.com',
            password: 'example-password',
            tags: ['示例', '可删除'],
            note: '首次使用会创建这条示例记录，可编辑或删除。',
            createdAt: now,
            updatedAt: now,
            lastUsedAt: '',
            openCount: 0,
            favorite: false
          }
        ],
        workspaces: [],
        sync: { token: '', gistId: '', lastSyncAt: '' }
      };
    }

    async function saveAndRender(message, options = {}) {
      await encryptVault();
      render();
      if (options.autoSync !== false) scheduleAutoSyncUpload();
      if (message) toast(message);
    }

    function filteredSites() {
      const query = $('searchInput').value.trim().toLowerCase();
      const selected = state.vault.workspaces.find((workspace) => workspace.id === state.selectedWorkspaceId);
      let sites = state.vault.sites;
      if (selected) {
        const allowed = new Set(selected.siteIds);
        sites = sites.filter((site) => allowed.has(site.id));
      }
      return applySiteQuery(sites, query);
    }

    function applySiteQuery(sites, query = $('searchInput').value.trim().toLowerCase()) {
      if (!query) return [...sites].sort(sortByRecent);
      return sites.filter((site) => [
        site.name, site.url, site.username, site.note, ...(site.tags || [])
      ].some((value) => String(value || '').toLowerCase().includes(query))).sort(sortByRecent);
    }

    function allSiteGroups() {
      const groupedSiteIds = new Set();
      const groups = state.vault.workspaces.map((workspace) => {
        const allowed = new Set(workspace.siteIds);
        workspace.siteIds.forEach((siteId) => groupedSiteIds.add(siteId));
        return {
          id: workspace.id,
          name: workspace.name,
          sites: applySiteQuery(state.vault.sites.filter((site) => allowed.has(site.id)))
        };
      }).filter((group) => group.sites.length);

      const defaultSites = applySiteQuery(state.vault.sites.filter((site) => !groupedSiteIds.has(site.id)));
      if (defaultSites.length) {
        groups.push({ id: 'default', name: '默认工作区', sites: defaultSites });
      }
      return groups;
    }

    function render() {
      renderStats();
      renderWorkspaces();
      renderSites();
      renderRankings();
      renderWorkspaceEditor();
      renderSiteWorkspacePicker();
    }

    function renderStats() {
      $('siteCount').textContent = `${state.vault.sites.length} 个网站`;
      $('workspaceCount').textContent = `${state.vault.workspaces.length} 个工作区`;
      $('openWorkspaceBtn').disabled = !state.selectedWorkspaceId;
      $('editWorkspaceBtn').disabled = !state.selectedWorkspaceId;
    }

    function renderWorkspaces() {
      const selected = state.vault.workspaces.find((workspace) => workspace.id === state.selectedWorkspaceId);
      $('allSitesBtn').classList.toggle('active', !selected);
      $('viewTitle').textContent = selected ? selected.name : '全部网站';
      $('viewSubtitle').textContent = selected
        ? `包含 ${selected.siteIds.length} 个网站，可一键打开`
        : '保存后会自动加密到本机浏览器';

      $('workspaceList').innerHTML = state.vault.workspaces.map((workspace) => `
        <button class="workspace-btn ${workspace.id === state.selectedWorkspaceId ? 'active' : ''}" type="button" data-workspace="${workspace.id}" data-drop-workspace="${workspace.id}">
          <svg viewBox="0 0 24 24"><path d="M3 7h6l2 3h10v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg>
          <span>${escapeHtml(workspace.name)}</span>
          <span class="muted">${workspace.siteIds.length}</span>
        </button>
      `).join('');
    }

    function renderSites() {
      const sites = filteredSites();
      animateSiteTable();
      if (!sites.length) {
        $('siteTable').innerHTML = '<div class="empty"><div><h2>没有匹配的网站</h2><p>新建网站或调整搜索关键词。</p></div></div>';
        return;
      }
      if (!state.selectedWorkspaceId) {
        const groups = allSiteGroups();
        $('siteTable').innerHTML = groups.map((group) => `
          <section class="site-group">
            <div class="site-group-head">
              <span class="site-group-title" title="${escapeHtml(group.name)}">${escapeHtml(group.name)}</span>
              <span class="muted">${group.sites.length} 个网站</span>
            </div>
            <div class="site-card-grid">
              ${group.sites.map((site) => renderCompactSiteCard(site, group.id === 'default' ? '' : group.id)).join('')}
            </div>
          </section>
        `).join('');
        return;
      }
      $('siteTable').innerHTML = sites.map((site) => renderSiteRow(site, state.selectedWorkspaceId)).join('');
    }

    function animateSiteTable() {
      const table = $('siteTable');
      table.classList.remove('is-switching');
      void table.offsetWidth;
      table.classList.add('is-switching');
      clearTimeout(window.siteTableAnimationTimer);
      window.siteTableAnimationTimer = setTimeout(() => table.classList.remove('is-switching'), 320);
    }

    function renderSiteRow(site, sourceWorkspaceId = '') {
      const faviconUrl = getFaviconUrl(site.url);
      return `
        <article class="site-row" draggable="true" data-site-id="${site.id}" data-source-workspace-id="${escapeHtml(sourceWorkspaceId)}" title="拖到左侧工作区可移动或复制">
          <div class="site-main">
            <span class="site-icon" aria-hidden="true">
              <span class="site-letter">${escapeHtml(getSiteLetter(site))}</span>
              ${faviconUrl ? `<img class="site-favicon" src="${escapeHtml(faviconUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add('hidden')">` : ''}
            </span>
            <div class="site-copy">
              <div class="site-title-line">
                ${site.favorite ? '<span class="favorite-mark" title="已收藏">★</span>' : ''}
                <div class="site-title" title="${escapeHtml(site.name)}">${escapeHtml(site.name)}</div>
              </div>
              <div class="site-url" title="${escapeHtml(site.url)}">${escapeHtml(site.url)}</div>
              <div class="tagline">${(site.tags || []).map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}</div>
            </div>
          </div>
          <div class="site-meta">
            <div class="muted">账号</div>
            <div class="site-title" title="${escapeHtml(site.username || '')}">${escapeHtml(site.username || '未填写')}</div>
          </div>
          <div class="site-meta">
            <div class="muted">备注</div>
            <div class="site-url" title="${escapeHtml(site.note || '')}">${escapeHtml(site.note || formatLastUsed(site.lastUsedAt))}</div>
          </div>
          <div class="row-actions">
            <button class="login-btn" type="button" title="打开网站并复制账号" data-login="${site.id}">${icons.open} 登录</button>
            <button class="icon-btn favorite-btn ${site.favorite ? 'is-favorite' : ''}" type="button" title="${site.favorite ? '取消收藏' : '收藏'}" data-favorite="${site.id}">${icons.star}</button>
            <button class="icon-btn" type="button" title="复制账号" data-copy-user="${site.id}">${icons.user}</button>
            <button class="icon-btn" type="button" title="复制密码" data-copy-pass="${site.id}">${icons.key}</button>
            <button class="icon-btn" type="button" title="编辑" data-edit="${site.id}">${icons.edit}</button>
          </div>
        </article>
      `;
    }

    function renderCompactSiteCard(site, sourceWorkspaceId = '') {
      const faviconUrl = getFaviconUrl(site.url);
      return `
        <article class="site-card" draggable="true" data-site-id="${site.id}" data-source-workspace-id="${escapeHtml(sourceWorkspaceId)}" title="点击打开，拖到左侧工作区可移动或复制">
          <div class="site-card-head">
            <span class="site-icon" aria-hidden="true">
              <span class="site-letter">${escapeHtml(getSiteLetter(site))}</span>
              ${faviconUrl ? `<img class="site-favicon" src="${escapeHtml(faviconUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add('hidden')">` : ''}
            </span>
            <div class="site-copy">
              <div class="site-title-line">
                ${site.favorite ? '<span class="favorite-mark" title="已收藏">★</span>' : ''}
                <div class="site-title" title="${escapeHtml(site.name)}">${escapeHtml(site.name)}</div>
              </div>
              <div class="site-url" title="${escapeHtml(site.url)}">${escapeHtml(site.url)}</div>
            </div>
          </div>
        </article>
      `;
    }

    function renderRankings() {
      const rankedSites = [...state.vault.sites]
        .filter((site) => Number(site.openCount || 0) > 0)
        .sort((a, b) => Number(b.openCount || 0) - Number(a.openCount || 0) || sortByRecent(a, b))
        .slice(0, 8);
      if (!rankedSites.length) {
        $('rankTable').innerHTML = '<div class="empty"><div><h2>还没有打开记录</h2><p>打开网站后会在这里排行。</p></div></div>';
        return;
      }
      $('rankTable').innerHTML = rankedSites.map((site, index) => `
        <div class="rank-row" data-rank-site-id="${site.id}" title="点击打开网站">
          <div class="rank-index">${index + 1}</div>
          <div class="site-main">
            <span class="site-icon" aria-hidden="true">
              <span class="site-letter">${escapeHtml(getSiteLetter(site))}</span>
              ${getFaviconUrl(site.url) ? `<img class="site-favicon" src="${escapeHtml(getFaviconUrl(site.url))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add('hidden')">` : ''}
            </span>
            <div class="site-copy">
              <div class="site-title-line">
                ${site.favorite ? '<span class="favorite-mark" title="已收藏">★</span>' : ''}
                <div class="site-title" title="${escapeHtml(site.name)}">${escapeHtml(site.name)}</div>
              </div>
              <div class="site-url" title="${escapeHtml(site.url)}">${escapeHtml(site.url)}</div>
            </div>
          </div>
          <span class="pill">${Number(site.openCount || 0)} 次</span>
        </div>
      `).join('');
    }

    function renderWorkspaceEditor() {
      const workspace = state.vault.workspaces.find((item) => item.id === state.editingWorkspaceId);
      $('workspaceName').value = workspace ? workspace.name : '';
      $('deleteWorkspaceBtn').classList.toggle('hidden', !workspace);
      const checked = new Set(workspace ? workspace.siteIds : []);
      if (!state.vault.sites.length) {
        $('workspaceSites').innerHTML = '<div class="check-row"><span></span><span class="muted">先新建网站</span></div>';
        return;
      }
      $('workspaceSites').innerHTML = state.vault.sites.map((site) => `
        <label class="check-row">
          <input type="checkbox" value="${site.id}" ${checked.has(site.id) ? 'checked' : ''}>
          <span>${escapeHtml(site.name)}</span>
        </label>
      `).join('');
    }

    function renderSiteWorkspacePicker(siteId = $('siteId').value) {
      if (!state.vault.workspaces.length) {
        $('siteWorkspaces').innerHTML = '<div class="check-row"><span></span><span class="muted">还没有工作区</span></div>';
        return;
      }
      const checked = siteId ? new Set(state.vault.workspaces
        .filter((workspace) => siteId && workspace.siteIds.includes(siteId))
        .map((workspace) => workspace.id)) : new Set(state.selectedWorkspaceId ? [state.selectedWorkspaceId] : []);
      $('siteWorkspaces').innerHTML = state.vault.workspaces.map((workspace) => `
        <label class="check-row">
          <input type="checkbox" value="${workspace.id}" ${checked.has(workspace.id) ? 'checked' : ''}>
          <span>${escapeHtml(workspace.name)}</span>
        </label>
      `).join('');
    }

    function resetSiteForm() {
      $('formTitle').textContent = '新建网站';
      $('siteId').value = '';
      $('siteForm').reset();
      $('deleteSiteBtn').classList.add('hidden');
      renderWorkspaceEditor();
      renderSiteWorkspacePicker();
    }

    function editSite(id) {
      const site = state.vault.sites.find((item) => item.id === id);
      if (!site) return;
      $('formTitle').textContent = '编辑网站';
      $('siteId').value = site.id;
      $('siteName').value = site.name || '';
      $('siteUrl').value = site.url || '';
      $('siteUsername').value = site.username || '';
      $('sitePassword').value = site.password || '';
      $('siteTags').value = (site.tags || []).join(', ');
      $('siteNote').value = site.note || '';
      $('deleteSiteBtn').classList.remove('hidden');
      renderSiteWorkspacePicker(site.id);
    }

    async function saveSite(event) {
      event.preventDefault();
      const id = $('siteId').value || uid('site');
      const now = new Date().toISOString();
      const existing = state.vault.sites.find((site) => site.id === id);
      const site = {
        id,
        name: $('siteName').value.trim(),
        url: normalizeUrl($('siteUrl').value.trim()),
        username: $('siteUsername').value.trim(),
        password: $('sitePassword').value,
        tags: $('siteTags').value.split(',').map((tag) => tag.trim()).filter(Boolean),
        note: $('siteNote').value.trim(),
        createdAt: existing ? existing.createdAt : now,
        updatedAt: now,
        lastUsedAt: existing ? existing.lastUsedAt : '',
        openCount: existing ? Number(existing.openCount || 0) : 0,
        favorite: existing ? Boolean(existing.favorite) : false
      };

      if (existing) {
        Object.assign(existing, site);
      } else {
        state.vault.sites.unshift(site);
      }
      syncSiteWorkspaceMembership(id);
      resetSiteForm();
      await saveAndRender('网站已保存');
    }

    function syncSiteWorkspaceMembership(siteId) {
      const selectedWorkspaceIds = new Set([...$('siteWorkspaces').querySelectorAll('input:checked')].map((input) => input.value));
      const now = new Date().toISOString();
      state.vault.workspaces.forEach((workspace) => {
        const hasSite = workspace.siteIds.includes(siteId);
        const shouldHaveSite = selectedWorkspaceIds.has(workspace.id);
        if (shouldHaveSite && !hasSite) {
          workspace.siteIds.push(siteId);
          workspace.updatedAt = now;
        }
        if (!shouldHaveSite && hasSite) {
          workspace.siteIds = workspace.siteIds.filter((id) => id !== siteId);
          workspace.updatedAt = now;
        }
      });
    }

    async function deleteSite() {
      const id = $('siteId').value;
      if (!id || !confirm('确定删除这个网站？')) return;
      state.vault.sites = state.vault.sites.filter((site) => site.id !== id);
      state.vault.workspaces.forEach((workspace) => {
        workspace.siteIds = workspace.siteIds.filter((siteId) => siteId !== id);
      });
      resetSiteForm();
      await saveAndRender('网站已删除');
    }

    function newWorkspace() {
      state.editingWorkspaceId = null;
      $('workspaceName').value = '';
      renderWorkspaceEditor();
      $('workspaceName').focus();
    }

    async function saveWorkspace() {
      const name = $('workspaceName').value.trim();
      if (!name) {
        toast('请填写工作区名称');
        return;
      }
      const siteIds = [...$('workspaceSites').querySelectorAll('input:checked')].map((input) => input.value);
      const now = new Date().toISOString();
      if (state.editingWorkspaceId) {
        const workspace = state.vault.workspaces.find((item) => item.id === state.editingWorkspaceId);
        if (workspace) Object.assign(workspace, { name, siteIds, updatedAt: now });
      } else {
        const workspace = { id: uid('workspace'), name, siteIds, createdAt: now, updatedAt: now };
        state.vault.workspaces.unshift(workspace);
        state.editingWorkspaceId = workspace.id;
        state.selectedWorkspaceId = workspace.id;
      }
      await saveAndRender('工作区已保存');
    }

    async function deleteWorkspace() {
      if (!state.editingWorkspaceId || !confirm('确定删除这个工作区？')) return;
      const id = state.editingWorkspaceId;
      state.vault.workspaces = state.vault.workspaces.filter((workspace) => workspace.id !== id);
      if (state.selectedWorkspaceId === id) state.selectedWorkspaceId = null;
      state.editingWorkspaceId = null;
      await saveAndRender('工作区已删除');
    }

    function chooseDropMode(site, workspace) {
      const choice = prompt(
        `将「${site.name}」放入「${workspace.name}」\n输入 1 复制，输入 2 移动，留空取消。`,
        '1'
      );
      if (choice === null || choice.trim() === '') return null;
      if (choice.trim() === '1') return 'copy';
      if (choice.trim() === '2') return 'move';
      toast('已取消拖放');
      return null;
    }

    async function addSiteToWorkspace(siteId, workspaceId, mode = 'copy', sourceWorkspaceId = '') {
      const site = state.vault.sites.find((item) => item.id === siteId);
      const workspace = state.vault.workspaces.find((item) => item.id === workspaceId);
      if (!site || !workspace) return;
      const alreadyInTarget = workspace.siteIds.includes(siteId);
      if (alreadyInTarget && (mode !== 'move' || sourceWorkspaceId === workspaceId)) {
        toast(`${site.name} 已在 ${workspace.name}`);
        return;
      }
      const now = new Date().toISOString();
      if (mode === 'move' && sourceWorkspaceId && sourceWorkspaceId !== workspaceId) {
        const sourceWorkspace = state.vault.workspaces.find((item) => item.id === sourceWorkspaceId);
        if (sourceWorkspace) {
          sourceWorkspace.siteIds = sourceWorkspace.siteIds.filter((id) => id !== siteId);
          sourceWorkspace.updatedAt = now;
        }
      }
      if (!alreadyInTarget) workspace.siteIds.push(siteId);
      workspace.updatedAt = now;
      state.selectedWorkspaceId = workspaceId;
      state.editingWorkspaceId = workspaceId;
      await saveAndRender(mode === 'move'
        ? `已将 ${site.name} 移动到 ${workspace.name}`
        : `已将 ${site.name} 复制到 ${workspace.name}`
      );
    }

    async function handleSiteDrop(siteId, workspaceId, sourceWorkspaceId = '') {
      const site = state.vault.sites.find((item) => item.id === siteId);
      const workspace = state.vault.workspaces.find((item) => item.id === workspaceId);
      if (!site || !workspace) return;
      const mode = chooseDropMode(site, workspace);
      if (!mode) return;
      await addSiteToWorkspace(siteId, workspaceId, mode, sourceWorkspaceId);
    }

    function dataTransferHasUrl(dataTransfer) {
      if (!dataTransfer) return false;
      return Array.from(dataTransfer.types).some((type) => ['text/uri-list', 'text/plain', 'text/html'].includes(type));
    }

    function extractUrlFromDrop(dataTransfer) {
      const uriList = dataTransfer.getData('text/uri-list')
        .split(/\r?\n/)
        .map((line) => line.trim())
        .find((line) => line && !line.startsWith('#'));
      const text = uriList || dataTransfer.getData('text/plain') || dataTransfer.getData('text/html');
      const match = String(text || '').match(/https?:\/\/[^\s"'<>]+/i);
      if (!match) return '';
      try {
        return new URL(normalizeUrl(match[0])).href;
      } catch (error) {
        return '';
      }
    }

    function siteNameFromUrl(url) {
      const host = getSiteHost(url).replace(/^www\./i, '');
      if (!host) return '新网站';
      return host.split('.').filter(Boolean).slice(0, -1).join('.') || host;
    }

    async function createSiteFromUrl(url, workspaceId = '') {
      const normalizedUrl = normalizeUrl(url);
      if (!getSiteHost(normalizedUrl)) {
        toast('没有识别到有效网址');
        return;
      }

      const existing = state.vault.sites.find((site) => site.url === normalizedUrl);
      if (existing) {
        if (workspaceId) {
          await addSiteToWorkspace(existing.id, workspaceId, 'copy');
        } else {
          editSite(existing.id);
          toast('这个网址已经存在');
        }
        return;
      }

      const now = new Date().toISOString();
      const site = {
        id: uid('site'),
        name: siteNameFromUrl(normalizedUrl),
        url: normalizedUrl,
        username: '',
        password: '',
        tags: [],
        note: '拖入工作台自动创建',
        createdAt: now,
        updatedAt: now,
        lastUsedAt: '',
        openCount: 0,
        favorite: false
      };
      state.vault.sites.unshift(site);
      if (workspaceId) {
        const workspace = state.vault.workspaces.find((item) => item.id === workspaceId);
        if (workspace && !workspace.siteIds.includes(site.id)) {
          workspace.siteIds.push(site.id);
          workspace.updatedAt = now;
          state.selectedWorkspaceId = workspaceId;
          state.editingWorkspaceId = workspaceId;
        }
      }
      await saveAndRender(workspaceId ? `已创建并加入 ${site.name}` : `已创建 ${site.name}`);
    }

    function clearWorkspaceDropTargets() {
      document.querySelectorAll('[data-drop-workspace]').forEach((target) => {
        target.classList.remove('drop-target');
      });
    }

    async function openCurrentWorkspace() {
      const sites = filteredSites();
      if (!sites.length) {
        toast('当前视图没有可打开的网站');
        return;
      }
      const openedTabs = sites.map(() => window.open('about:blank', '_blank'));
      const blockedCount = openedTabs.filter((tab) => !tab).length;
      openedTabs.forEach((tab, index) => {
        if (!tab) return;
        tab.opener = null;
        tab.location.href = sites[index].url;
      });
      const now = new Date().toISOString();
      sites.forEach((site) => {
        site.lastUsedAt = now;
        site.openCount = Number(site.openCount || 0) + 1;
      });
      await saveAndRender(blockedCount
        ? `浏览器拦截了 ${blockedCount} 个标签，请允许此站点弹出窗口后重试`
        : `已打开 ${sites.length} 个网站`
      );
    }

    function markSiteOpened(site) {
      site.lastUsedAt = new Date().toISOString();
      site.openCount = Number(site.openCount || 0) + 1;
    }

    async function quickLogin(id) {
      const site = state.vault.sites.find((item) => item.id === id);
      if (!site) return;
      if (site.username) {
        await navigator.clipboard.writeText(site.username);
      }
      window.open(site.url, '_blank', 'noopener');
      markSiteOpened(site);
      await saveAndRender(site.username ? '已打开网站，并复制账号' : '已打开网站');
    }

    async function openSite(id) {
      const site = state.vault.sites.find((item) => item.id === id);
      if (!site) return;
      window.open(site.url, '_blank', 'noopener');
      markSiteOpened(site);
      await saveAndRender('已打开网站');
    }

    async function toggleFavorite(id) {
      const site = state.vault.sites.find((item) => item.id === id);
      if (!site) return;
      site.favorite = !site.favorite;
      site.updatedAt = new Date().toISOString();
      await saveAndRender(site.favorite ? '已收藏' : '已取消收藏');
    }

    async function pasteUrlFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        const match = String(text || '').match(/https?:\/\/[^\s"'<>]+/i);
        $('siteUrl').value = match ? normalizeUrl(match[0]) : text.trim();
        $('siteUrl').focus();
        toast('已粘贴到登录网址');
      } catch (error) {
        toast('无法读取剪贴板，请手动粘贴');
      }
    }

    async function copyText(value, label) {
      if (!value) {
        toast(`${label}为空`);
        return;
      }
      await navigator.clipboard.writeText(value);
      toast(label === '密码' ? '密码已复制，使用后建议清空剪贴板' : `${label}已复制`);
    }

    async function clearClipboard() {
      await navigator.clipboard.writeText('');
      toast('剪贴板已清空');
    }

    function editSelectedWorkspace() {
      if (!state.selectedWorkspaceId) {
        toast('请先选择一个工作区');
        return;
      }
      state.editingWorkspaceId = state.selectedWorkspaceId;
      renderWorkspaceEditor();
      $('workspaceName').focus();
    }

    function scheduleAutoLock() {
      clearTimeout(state.autoLockTimer);
      if (!state.unlocked || !state.autoLockMinutes) return;
      state.autoLockTimer = setTimeout(() => {
        lock();
        toast('已自动锁定');
      }, state.autoLockMinutes * 60 * 1000);
    }

    function noteActivity() {
      if (!state.unlocked) return;
      scheduleAutoLock();
    }

    function formatLastUsed(value) {
      if (!value) return '无';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '无';
      return `最近使用 ${date.toLocaleString('zh-CN', {
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      })}`;
    }

    function generatePassword(length = 18) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*()-_=+';
      const bytes = crypto.getRandomValues(new Uint32Array(length));
      return [...bytes].map((value) => chars[value % chars.length]).join('');
    }

    function togglePasswordField() {
      const input = $('sitePassword');
      input.type = input.type === 'password' ? 'text' : 'password';
      input.focus();
    }

    function fillGeneratedPassword() {
      $('sitePassword').value = generatePassword();
      $('sitePassword').type = 'text';
      toast('已生成密码');
    }

    function normalizeUrl(url) {
      if (!/^https?:\/\//i.test(url)) return `https://${url}`;
      return url;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function toast(message) {
      $('toast').textContent = message;
      $('toast').classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
    }

    function lock() {
      clearTimeout(state.autoLockTimer);
      cancelAutoSyncUpload('');
      state.unlocked = false;
      state.key = null;
      state.salt = null;
      state.vault = { sites: [], workspaces: [] };
      state.selectedWorkspaceId = null;
      state.editingWorkspaceId = null;
      $('app').classList.add('hidden');
      $('lockScreen').classList.remove('hidden');
      $('masterPassword').focus();
    }

    async function exportVault() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const blob = new Blob([raw], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `login-workbench-backup-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(url);
      toast('加密备份已导出');
    }

    function importVault() {
      $('importFile').click();
    }

    async function handleImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const text = await file.text();
      try {
        const parsed = JSON.parse(text);
        if (!parsed.salt || !parsed.iv || !parsed.data) throw new Error('bad file');
        localStorage.setItem(STORAGE_KEY, text);
        toast('已导入，请用备份的主密码重新解锁');
        lock();
      } catch (error) {
        toast('导入文件格式不正确');
      } finally {
        event.target.value = '';
      }
    }

    function loadSyncSettings() {
      const legacy = loadLegacySyncSettings();
      const vaultSync = state.vault && state.vault.sync ? state.vault.sync : {};
      state.sync = { token: '', gistId: '', lastSyncAt: '', ...legacy, ...vaultSync };
      $('gistTokenInput').value = state.sync.token || '';
      renderSyncStatus();
    }

    async function saveSyncSettings() {
      state.sync.token = $('gistTokenInput').value.trim();
      await persistSyncSettings();
      renderSyncStatus('Token 已保存');
      if (state.sync.token && state.unlocked) {
        scheduleAutoSyncUpload();
      } else {
        cancelAutoSyncUpload('');
      }
    }

    function loadLegacySyncSettings() {
      try {
        return JSON.parse(localStorage.getItem(SYNC_SETTINGS_KEY)) || {};
      } catch {
        return {};
      }
    }

    async function persistSyncSettings() {
      localStorage.setItem(SYNC_SETTINGS_KEY, JSON.stringify(state.sync));
      if (state.unlocked && state.vault) {
        state.vault.sync = { ...state.sync };
        await encryptVault();
      }
    }

    function renderSyncStatus(message) {
      const configured = Boolean(state.sync.token);
      const lastSync = state.sync.lastSyncAt ? `，上次同步 ${new Date(state.sync.lastSyncAt).toLocaleString('zh-CN')}` : '';
      const gistState = state.sync.gistId ? '，已找到同步 Gist' : '';
      $('syncStatus').textContent = message || (configured ? `已配置 Token${gistState}${lastSync}` : '未配置同步');
    }

    function scheduleAutoSyncUpload() {
      if (!state.unlocked || state.autoSyncInFlight || !state.sync.token) {
        renderAutoSyncCountdown();
        return;
      }
      clearTimeout(state.autoSyncTimer);
      clearInterval(state.autoSyncInterval);
      state.autoSyncDueAt = Date.now() + 15000;
      state.autoSyncTimer = setTimeout(() => {
        runScheduledAutoSync();
      }, 15000);
      state.autoSyncInterval = setInterval(renderAutoSyncCountdown, 1000);
      renderAutoSyncCountdown();
    }

    function cancelAutoSyncUpload(message = '已取消自动上传') {
      clearTimeout(state.autoSyncTimer);
      clearInterval(state.autoSyncInterval);
      state.autoSyncTimer = null;
      state.autoSyncInterval = null;
      state.autoSyncDueAt = 0;
      renderAutoSyncCountdown();
      if (message) toast(message);
    }

    function renderAutoSyncCountdown() {
      const box = $('syncCountdown');
      if (!box) return;
      if (!state.autoSyncDueAt) {
        box.classList.add('hidden');
        return;
      }
      const seconds = Math.max(0, Math.ceil((state.autoSyncDueAt - Date.now()) / 1000));
      $('syncCountdownText').textContent = seconds > 0 ? `${seconds} 秒后自动上传` : '正在自动上传...';
      box.classList.remove('hidden');
    }

    async function runScheduledAutoSync() {
      clearTimeout(state.autoSyncTimer);
      clearInterval(state.autoSyncInterval);
      state.autoSyncTimer = null;
      state.autoSyncInterval = null;
      state.autoSyncDueAt = Date.now();
      renderAutoSyncCountdown();
      await pushToGist({ automatic: true }).catch((error) => {
        cancelAutoSyncUpload('');
        renderSyncStatus(error.message);
        toast(error.message);
      });
    }

    async function pushToGist(options = {}) {
      const automatic = Boolean(options.automatic);
      if (!automatic) cancelAutoSyncUpload('');
      if (state.autoSyncInFlight) {
        toast('正在上传同步');
        return;
      }
      const token = $('gistTokenInput').value.trim();
      if (!token) {
        cancelAutoSyncUpload('');
        toast('请先填写 GitHub Token');
        return;
      }
      state.autoSyncInFlight = true;
      try {
        const foundGistId = await findPasswordWorkspaceGist(token);
        let gistId = foundGistId || state.sync.gistId || '';
        state.sync = { token, gistId, lastSyncAt: new Date().toISOString() };
        await persistSyncSettings();
        const encryptedVault = localStorage.getItem(STORAGE_KEY);
        if (!encryptedVault) {
          cancelAutoSyncUpload('');
          toast('没有可同步的加密数据');
          return;
        }

        const payload = {
          description: 'Password Workspace encrypted vault',
          public: false,
          files: {
            [GIST_FILENAME]: {
              content: encryptedVault
            }
          }
        };

        let response;
        try {
          response = await gistRequest(gistId ? `https://api.github.com/gists/${gistId}` : 'https://api.github.com/gists', {
            method: gistId ? 'PATCH' : 'POST',
            token,
            body: payload
          });
        } catch (error) {
          if (!gistId || foundGistId) throw error;
          response = await gistRequest('https://api.github.com/gists', {
            method: 'POST',
            token,
            body: payload
          });
        }

        gistId = response.id;
        state.sync = { token, gistId, lastSyncAt: new Date().toISOString() };
        await persistSyncSettings();
        cancelAutoSyncUpload('');
        renderSyncStatus(automatic ? '已自动上传加密数据到 Gist' : '已上传加密数据到 Gist');
        toast(automatic ? '自动同步完成' : 'Gist 同步上传完成');
      } finally {
        state.autoSyncInFlight = false;
      }
    }

    async function pullFromGist() {
      cancelAutoSyncUpload('');
      const token = $('gistTokenInput').value.trim();
      if (!token) {
        toast('请先填写 GitHub Token');
        return;
      }
      const gistId = await findPasswordWorkspaceGist(token) || state.sync.gistId || '';
      if (!gistId) {
        toast('没有找到同步 Gist，请先在有数据的设备上传一次');
        return;
      }
      if (!confirm('拉取会覆盖当前浏览器里的加密数据。继续？')) return;

      const response = await gistRequest(`https://api.github.com/gists/${gistId}`, { method: 'GET', token });
      const file = response.files && response.files[GIST_FILENAME];
      if (!file || !file.content) {
        toast('Gist 中没有找到同步文件');
        return;
      }

      const parsed = JSON.parse(file.content);
      if (!parsed.salt || !parsed.iv || !parsed.data) {
        toast('Gist 数据格式不正确');
        return;
      }
      localStorage.setItem(STORAGE_KEY, file.content);
      state.sync = { token, gistId, lastSyncAt: new Date().toISOString() };
      localStorage.setItem(SYNC_SETTINGS_KEY, JSON.stringify(state.sync));
      renderSyncStatus('已从 Gist 拉取加密数据，请重新解锁');
      lock();
    }

    async function findPasswordWorkspaceGist(token) {
      const response = await gistRequest('https://api.github.com/gists?per_page=100', { method: 'GET', token });
      const gist = Array.isArray(response)
        ? response.find((item) => item.files && item.files[GIST_FILENAME])
        : null;
      return gist ? gist.id : '';
    }

    async function gistRequest(url, options) {
      const response = await fetch(url, {
        method: options.method,
        headers: {
          Accept: 'application/vnd.github+json',
          Authorization: `Bearer ${options.token}`,
          'X-GitHub-Api-Version': '2022-11-28',
          ...(options.body ? { 'Content-Type': 'application/json' } : {})
        },
        body: options.body ? JSON.stringify(options.body) : undefined
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(formatGistError(response.status, text));
      }
      return response.json();
    }

    function formatGistError(status, text) {
      let message = '';
      try {
        message = JSON.parse(text).message || '';
      } catch {
        message = text || '';
      }
      if (status === 401) {
        return 'GitHub Token 无效或已过期，请重新生成 Token。';
      }
      if (status === 403 && message.includes('Resource not accessible by personal access token')) {
        return 'GitHub Token 缺少 Gists 读写权限。Fine-grained token 请在 Account permissions 里把 Gists 设为 Read and write；classic token 请勾选 gist。';
      }
      if (status === 404) {
        return '没有找到同步 Gist，或这个 Token 不能访问它。可以先在有数据的设备点“上传同步”自动创建。';
      }
      return `GitHub Gist 请求失败：${status}${message ? ` ${message}` : ''}`;
    }

    function bindEvents() {
      $('unlockBtn').addEventListener('click', unlock);
      document.addEventListener('pointermove', updatePointerEffects, { passive: true });
      $('masterPassword').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') unlock();
      });
      $('resetBtn').addEventListener('click', () => {
        if (confirm('确定清空本机保存的所有加密数据？')) {
          localStorage.removeItem(STORAGE_KEY);
          $('firstRunNote').classList.remove('hidden');
          toast('已清空');
        }
      });
      $('lockBtn').addEventListener('click', lock);
      $('searchInput').addEventListener('input', renderSites);
      $('siteForm').addEventListener('submit', saveSite);
      $('deleteSiteBtn').addEventListener('click', deleteSite);
      $('clearFormBtn').addEventListener('click', resetSiteForm);
      $('togglePasswordBtn').addEventListener('click', togglePasswordField);
      $('generatePasswordBtn').addEventListener('click', fillGeneratedPassword);
      $('pasteUrlBtn').addEventListener('click', pasteUrlFromClipboard);
      $('newSiteBtn').addEventListener('click', () => {
        resetSiteForm();
        $('siteName').focus();
      });
      $('newWorkspaceBtn').addEventListener('click', newWorkspace);
      $('saveWorkspaceBtn').addEventListener('click', saveWorkspace);
      $('deleteWorkspaceBtn').addEventListener('click', deleteWorkspace);
      $('openWorkspaceBtn').addEventListener('click', openCurrentWorkspace);
      $('editWorkspaceBtn').addEventListener('click', editSelectedWorkspace);
      $('clearClipboardBtn').addEventListener('click', clearClipboard);
      $('saveSyncBtn').addEventListener('click', saveSyncSettings);
      $('pushGistBtn').addEventListener('click', () => pushToGist().catch((error) => toast(error.message)));
      $('pullGistBtn').addEventListener('click', () => pullFromGist().catch((error) => toast(error.message)));
      $('cancelAutoSyncBtn').addEventListener('click', () => cancelAutoSyncUpload());
      $('autoLockSelect').addEventListener('change', (event) => {
        state.autoLockMinutes = Number(event.target.value);
        scheduleAutoLock();
        toast(state.autoLockMinutes ? `自动锁定已设为 ${state.autoLockMinutes} 分钟` : '已关闭自动锁定');
      });
      $('exportBtn').addEventListener('click', exportVault);
      $('importBtn').addEventListener('click', importVault);
      $('importFile').addEventListener('change', handleImport);
      ['click', 'keydown', 'input'].forEach((eventName) => {
        document.addEventListener(eventName, noteActivity, { passive: true });
      });
      $('allSitesBtn').addEventListener('click', () => {
        state.selectedWorkspaceId = null;
        render();
      });

      $('workspaceList').addEventListener('click', (event) => {
        const button = event.target.closest('[data-workspace]');
        if (!button) return;
        state.selectedWorkspaceId = button.dataset.workspace;
        state.editingWorkspaceId = button.dataset.workspace;
        render();
      });
      $('workspaceList').addEventListener('dragover', (event) => {
        const target = event.target.closest('[data-drop-workspace]');
        if (!target || (!state.draggingSiteId && !dataTransferHasUrl(event.dataTransfer))) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = state.draggingSiteId ? 'copy' : 'link';
        clearWorkspaceDropTargets();
        target.classList.add('drop-target');
      });
      $('workspaceList').addEventListener('dragleave', (event) => {
        const target = event.target.closest('[data-drop-workspace]');
        if (target && !target.contains(event.relatedTarget)) {
          target.classList.remove('drop-target');
        }
      });
      $('workspaceList').addEventListener('drop', async (event) => {
        const target = event.target.closest('[data-drop-workspace]');
        if (!target) return;
        event.preventDefault();
        clearWorkspaceDropTargets();
        if (state.draggingSiteId) {
          const siteId = event.dataTransfer.getData('text/plain') || state.draggingSiteId;
          const sourceWorkspaceId = event.dataTransfer.getData('application/x-source-workspace') || state.draggingSourceWorkspaceId || '';
          await handleSiteDrop(siteId, target.dataset.dropWorkspace, sourceWorkspaceId);
          return;
        }
        const url = extractUrlFromDrop(event.dataTransfer);
        if (url) await createSiteFromUrl(url, target.dataset.dropWorkspace);
      });

      document.addEventListener('dragover', (event) => {
        if (state.draggingSiteId || !dataTransferHasUrl(event.dataTransfer)) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = 'link';
      });

      document.addEventListener('drop', (event) => {
        if (state.draggingSiteId || event.target.closest('[data-drop-workspace]')) return;
        const url = extractUrlFromDrop(event.dataTransfer);
        if (!url) return;
        event.preventDefault();
        createSiteFromUrl(url, state.selectedWorkspaceId || '');
      });

      $('siteTable').addEventListener('click', (event) => {
        const row = event.target.closest('[data-site-id]');
        const loginButton = event.target.closest('[data-login]');
        const favoriteButton = event.target.closest('[data-favorite]');
        const userButton = event.target.closest('[data-copy-user]');
        const passButton = event.target.closest('[data-copy-pass]');
        const editButton = event.target.closest('[data-edit]');
        if (loginButton) {
          quickLogin(loginButton.dataset.login);
          return;
        }
        if (favoriteButton) {
          toggleFavorite(favoriteButton.dataset.favorite);
          return;
        }
        if (userButton) {
          const site = state.vault.sites.find((item) => item.id === userButton.dataset.copyUser);
          copyText(site && site.username, '账号');
          return;
        }
        if (passButton) {
          const site = state.vault.sites.find((item) => item.id === passButton.dataset.copyPass);
          copyText(site && site.password, '密码');
          if (event.shiftKey) clearClipboard();
          return;
        }
        if (editButton) {
          editSite(editButton.dataset.edit);
          return;
        }
        if (row) openSite(row.dataset.siteId);
      });
      $('siteTable').addEventListener('dragstart', (event) => {
        const row = event.target.closest('[data-site-id]');
        if (!row) return;
        state.draggingSiteId = row.dataset.siteId;
        state.draggingSourceWorkspaceId = row.dataset.sourceWorkspaceId || '';
        row.classList.add('is-dragging');
        event.dataTransfer.effectAllowed = 'copyMove';
        event.dataTransfer.setData('text/plain', row.dataset.siteId);
        event.dataTransfer.setData('application/x-source-workspace', row.dataset.sourceWorkspaceId || '');
      });
      $('siteTable').addEventListener('dragend', (event) => {
        const row = event.target.closest('[data-site-id]');
        if (row) row.classList.remove('is-dragging');
        state.draggingSiteId = null;
        state.draggingSourceWorkspaceId = null;
        clearWorkspaceDropTargets();
      });
      $('rankTable').addEventListener('click', (event) => {
        const row = event.target.closest('[data-rank-site-id]');
        if (row) openSite(row.dataset.rankSiteId);
      });
    }

    function updatePointerEffects(event) {
      const x = event.clientX;
      const y = event.clientY;
      document.documentElement.style.setProperty('--spotlight-x', `${x}px`);
      document.documentElement.style.setProperty('--spotlight-y', `${y}px`);
      document.documentElement.style.setProperty('--parallax-x', `${(x / window.innerWidth - .5) * -14}px`);
      document.documentElement.style.setProperty('--parallax-y', `${(y / window.innerHeight - .5) * -10}px`);
    }

    function boot() {
      bindEvents();
      loadSyncSettings();
      $('firstRunNote').classList.toggle('hidden', Boolean(localStorage.getItem(STORAGE_KEY)));
      $('masterPassword').focus();
    }

    boot();
  </script>
</body>
</html>
